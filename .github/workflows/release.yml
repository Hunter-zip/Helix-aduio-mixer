name: Release

# Buduje gotową paczkę dla Windows i dokleja ją do wydania.
# Uruchomienie: push taga v* albo ręcznie z zakładki Actions.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: Paczka dla Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Budowanie silnika
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DHELIX_WERROR=OFF -DHELIX_BUILD_TESTS=OFF
          cmake --build build --config Release -j

      - name: Budowanie instalatora GUI
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zebranie paczki
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build/Release/helix-engine.exe release/
          Copy-Item build/Release/helix-cli.exe release/
          Get-ChildItem ui/dist -Filter *.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName release/ }
          Compress-Archive -Path release/* -DestinationPath helix-audio-mixer-windows-x64.zip

      - name: Publikacja artefaktu
        uses: actions/upload-artifact@v4
        with:
          name: helix-audio-mixer-windows-x64
          path: helix-audio-mixer-windows-x64.zip

      - name: Doklejenie do wydania
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: helix-audio-mixer-windows-x64.zip
